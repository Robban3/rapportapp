<table cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f5f8f7;margin:0;padding:0">
  <tr><td align="center" style="padding:24px 12px">
    <table cellpadding="0" cellspacing="0" border="0" width="560" style="max-width:560px;background:#ffffff;border:1px solid #dde7e3;border-radius:10px">
      <tr><td style="padding:30px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0e1c18">

        <table cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td style="width:30px;height:30px;background:#0d9488;border-radius:8px;color:#ffffff;font-size:15px;font-weight:800;text-align:center;vertical-align:middle">R</td>
            <td style="padding-left:10px;font-size:16px;font-weight:800;letter-spacing:-.01em">Raptr</td>
          </tr>
        </table>

        <h1 style="margin:22px 0 10px;font-size:19px;line-height:1.3">Bekräfta din e-postadress</h1>

        <div style="font-size:14px;line-height:1.6;color:#3c4f49">Klicka nedan för att bekräfta att <b>{{ .Email }}</b> är din adress.</div>

        <table cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 6px">
          <tr><td style="background:#0d9488;border-radius:8px">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 22px;font-size:14px;font-weight:700;color:#ffffff;text-decoration:none">Bekräfta adressen</a>
          </td></tr>
        </table>

        <p style="margin:16px 0 0;font-size:12px;line-height:1.6;color:#6a7f79">
          Fungerar inte knappen? Kopiera den här adressen till webbläsaren:<br>
          <span style="word-break:break-all;color:#0d9488">{{ .ConfirmationURL }}</span>
        </p>

        <p style="margin:22px 0 0;padding-top:16px;border-top:1px solid #dde7e3;font-size:12px;line-height:1.6;color:#6a7f79">
          Väntade du dig inte det här mejlet kan du strunta i det.
        </p>

      </td></tr>
    </table>
  </td></tr>
</table>
